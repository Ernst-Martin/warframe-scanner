class WarframeMarketService {
  constructor(base_url) {
    this.base_url = base_url;
    this.all_items = [];
    this.is_using_fallback = false;
  }

  async fetch_json_with_fallback(target_url) {
    let direct_response;
    let direct_error_message;
    let proxy_index;
    let proxy_count;
    let proxy_url;
    let proxy_response;
    let last_error_message;

    direct_error_message = "";

    try {
      direct_response = await fetch(target_url);
      if (direct_response.ok) {
        return await direct_response.json();
      }
      direct_error_message = "HTTP " + direct_response.status;
    } catch (direct_error) {
      direct_error_message = direct_error.message;
    }

    console.log("[API] Direct request failed (" + direct_error_message + "), trying proxies...");

    last_error_message = "Direct: " + direct_error_message;
    proxy_count = AppConfig.cors_proxy_prefixes.length;

    for (proxy_index = 0; proxy_index < proxy_count; proxy_index++) {
      proxy_url = AppConfig.cors_proxy_prefixes[proxy_index] + encodeURIComponent(target_url);

      try {
        proxy_response = await fetch(proxy_url);
        if (proxy_response.ok) {
          return await proxy_response.json();
        }
        last_error_message = last_error_message + " | Proxy " + (proxy_index + 1) + ": HTTP " + proxy_response.status;
      } catch (proxy_error) {
        last_error_message = last_error_message + " | Proxy " + (proxy_index + 1) + ": " + proxy_error.message;
      }
    }

    throw new Error(last_error_message);
  }

  extract_display_name(raw_item) {
    if (raw_item.i18n && raw_item.i18n.en && raw_item.i18n.en.name) {
      return raw_item.i18n.en.name;
    }
    if (raw_item.name) {
      return raw_item.name;
    }
    return raw_item.slug;
  }

  async fetch_all_items() {
    let response;
    let raw_items;
    let index;
    let count;
    let raw_item;

    console.log("[API] Loading local item catalog from items.json");

    response = await fetch("./items.json");

    if (!response.ok) {
      throw new Error("items.json could not be loaded (HTTP " + response.status + ")");
    }

    raw_items = await response.json();
    count = raw_items.length;

    for (index = 0; index < count; index++) {
      raw_item = raw_items[index];
      this.all_items.push(new WarframeItem(raw_item.name, raw_item.slug, null, null));
    }

    console.log("[API] " + this.all_items.length + " items loaded");

    return this.all_items;
  }

  async fetch_top_sell_price(slug) {
    let json_body;
    let sell_orders;
    let cheapest_price;
    let index;
    let count;
    let order_price;

    try {
      json_body = await this.fetch_json_with_fallback(this.base_url + "/orders/item/" + slug + "/top");
    } catch (fetch_error) {
      return { price: null, order_count: 0 };
    }

    sell_orders = json_body.data && json_body.data.sell ? json_body.data.sell : [];
    count = sell_orders.length;
    cheapest_price = null;

    for (index = 0; index < count; index++) {
      order_price = sell_orders[index].platinum;
      if (cheapest_price === null || order_price < cheapest_price) {
        cheapest_price = order_price;
      }
    }

    return { price: cheapest_price, order_count: count };
  }

  get_all_items() {
    return this.all_items;
  }

  async get_price_for_item(item) {
    return await this.fetch_top_sell_price(item.slug);
  }
}

class OcrService {
  constructor(name_source) {
    this.name_source = name_source;
  }

  scan_screenshot_mock() {
    let all_items;
    let detected_names;
    let random_count;
    let index;
    let random_index;

    all_items = this.name_source.get_all_items();
    detected_names = [];
    random_count = 3 + Math.floor(Math.random() * 3);

    for (index = 0; index < random_count; index++) {
      random_index = Math.floor(Math.random() * all_items.length);
      detected_names.push(all_items[random_index].slug);
    }

    return detected_names;
  }

  async preprocess_image(image_file) {
    let image_element;
    let canvas;
    let canvas_context;
    let scale_factor;
    let target_width;
    let target_height;
    let image_data;
    let pixel_data;
    let pixel_index;
    let gray_value;
    let threshold_value;
    let final_value;

    image_element = await this.load_image_element(image_file);
    scale_factor = 2;
    target_width = image_element.width * scale_factor;
    target_height = image_element.height * scale_factor;

    canvas = document.createElement("canvas");
    canvas.width = target_width;
    canvas.height = target_height;
    canvas_context = canvas.getContext("2d");
    canvas_context.drawImage(image_element, 0, 0, target_width, target_height);

    image_data = canvas_context.getImageData(0, 0, target_width, target_height);
    pixel_data = image_data.data;
    threshold_value = 140;

    for (pixel_index = 0; pixel_index < pixel_data.length; pixel_index += 4) {
      gray_value = (pixel_data[pixel_index] * 0.3) + (pixel_data[pixel_index + 1] * 0.59) + (pixel_data[pixel_index + 2] * 0.11);
      final_value = gray_value > threshold_value ? 255 : 0;
      pixel_data[pixel_index] = final_value;
      pixel_data[pixel_index + 1] = final_value;
      pixel_data[pixel_index + 2] = final_value;
    }

    canvas_context.putImageData(image_data, 0, 0);

    return canvas;
  }

  load_image_element(image_file) {
    return new Promise(function (resolve, reject) {
      let image_element;
      let object_url;

      image_element = new Image();
      object_url = URL.createObjectURL(image_file);

      image_element.onload = function () {
        resolve(image_element);
      };
      image_element.onerror = function () {
        reject(new Error("Image could not be loaded"));
      };

      image_element.src = object_url;
    });
  }

  async scan_screenshot_real(image_file, progress_callback) {
    let preprocessed_canvas;
    let recognition_result;

    preprocessed_canvas = await this.preprocess_image(image_file);
    this.last_preprocessed_canvas = preprocessed_canvas;

    recognition_result = await Tesseract.recognize(preprocessed_canvas, "eng", {
      logger: function (log_entry) {
        if (log_entry.status === "recognizing text" && progress_callback) {
          progress_callback(Math.round(log_entry.progress * 100));
        }
      }
    });

    return recognition_result.data.text;
  }
}

class MatchResult {
  constructor(item_name, matched_slug, platinum_price, was_found, order_count) {
    this.item_name = item_name;
    this.matched_slug = matched_slug;
    this.platinum_price = platinum_price;
    this.was_found = was_found;
    this.order_count = order_count === undefined ? null : order_count;
  }
}

class PriceMatchingService {
  constructor(catalog_source) {
    this.catalog_source = catalog_source;
  }

  find_item_by_name(item_name) {
    let all_items;
    let index;
    let count;

    all_items = this.catalog_source.get_all_items();
    count = all_items.length;

    for (index = 0; index < count; index++) {
      if (all_items[index].name === item_name) {
        return all_items[index];
      }
    }

    return null;
  }

  get_base_name(item_name) {
    let known_suffixes;
    let words;
    let last_word;

    known_suffixes = ["Blueprint", "Chassis", "Systems", "Neuroptics", "Barrel", "Receiver", "Stock", "Handle", "Blade", "Disc", "Grip", "String", "Link", "Stars", "Ornament", "Hilt", "Guard", "Pouch", "Cerebrum", "Head", "Blades"];
    words = item_name.split(" ");
    last_word = words[words.length - 1];

    if (known_suffixes.includes(last_word)) {
      return words.slice(0, words.length - 1).join(" ");
    }

    return null;
  }

  async detect_set_bonuses(match_results) {
    let groups;
    let index;
    let count;
    let base_name;
    let group_key;
    let set_item;
    let set_price_result;
    let suggestions;
    let group_names;

    groups = {};
    count = match_results.length;

    for (index = 0; index < count; index++) {
      if (!match_results[index].was_found) {
        continue;
      }

      base_name = this.get_base_name(match_results[index].item_name);

      if (base_name === null) {
        continue;
      }

      if (!groups[base_name]) {
        groups[base_name] = [];
      }

      groups[base_name].push(match_results[index].item_name);
    }

    suggestions = [];

    for (group_key in groups) {
      group_names = groups[group_key];

      if (group_names.length < 2) {
        continue;
      }

      set_item = this.find_item_by_name(group_key + " Set");

      if (set_item === null) {
        continue;
      }

      set_price_result = await this.catalog_source.get_price_for_item(set_item);

      suggestions.push({
        base_name: group_key,
        parts_found: group_names.length,
        parts_list: group_names,
        set_slug: set_item.slug,
        set_price: set_price_result.price
      });
    }

    return suggestions;
  }

  find_item_by_slug(slug) {
    let all_items;
    let index;
    let count;

    all_items = this.catalog_source.get_all_items();
    count = all_items.length;

    for (index = 0; index < count; index++) {
      if (all_items[index].slug === slug) {
        return all_items[index];
      }
    }

    return null;
  }

  normalize_text(raw_text) {
    return raw_text.toLowerCase().replace(/[^a-z0-9]/g, "");
  }

  async match_ocr_text(raw_ocr_text, progress_callback) {
    let all_items;
    let normalized_ocr_text;
    let normalized_item_name;
    let name_prefix;
    let prefix_length;
    let index;
    let count;
    let matched_items;
    let already_matched_slugs;
    let results;
    let batch_size;
    let batch_start;
    let batch_items;
    let batch_promises;
    let batch_results;
    let batch_index;

    all_items = this.catalog_source.get_all_items();
    normalized_ocr_text = this.normalize_text(raw_ocr_text);
    matched_items = [];
    already_matched_slugs = [];
    count = all_items.length;
    prefix_length = 16;

    for (index = 0; index < count; index++) {
      normalized_item_name = this.normalize_text(all_items[index].name);

      if (normalized_item_name.length < 6) {
        continue;
      }

      name_prefix = normalized_item_name.substring(0, Math.min(prefix_length, normalized_item_name.length));

      if (normalized_ocr_text.includes(name_prefix) && !already_matched_slugs.includes(all_items[index].slug)) {
        already_matched_slugs.push(all_items[index].slug);
        matched_items.push(all_items[index]);
      }
    }

    if (progress_callback) {
      progress_callback(matched_items.length);
    }

    results = [];
    batch_size = 4;

    for (batch_start = 0; batch_start < matched_items.length; batch_start += batch_size) {
      batch_items = matched_items.slice(batch_start, batch_start + batch_size);

      batch_promises = [];
      for (batch_index = 0; batch_index < batch_items.length; batch_index++) {
        batch_promises.push(this.catalog_source.get_price_for_item(batch_items[batch_index]));
      }

      batch_results = await Promise.all(batch_promises);

      for (batch_index = 0; batch_index < batch_items.length; batch_index++) {
        results.push(new MatchResult(batch_items[batch_index].name, batch_items[batch_index].slug, batch_results[batch_index].price, true, batch_results[batch_index].order_count));
      }

      if (progress_callback) {
        progress_callback(matched_items.length, results.length);
      }
    }

    return results;
  }

  async match_detected_slugs(detected_slugs) {
    let results;
    let index;
    let count;
    let matched_item;
    let price_result;

    results = [];
    count = detected_slugs.length;

    for (index = 0; index < count; index++) {
      matched_item = this.find_item_by_slug(detected_slugs[index]);

      if (matched_item === null) {
        results.push(new MatchResult(detected_slugs[index], null, null, false));
        continue;
      }

      price_result = await this.catalog_source.get_price_for_item(matched_item);
      results.push(new MatchResult(matched_item.name, matched_item.slug, price_result.price, true, price_result.order_count));
    }

    return results;
  }

  calculate_total_value(match_results) {
    let total;
    let index;
    let count;

    total = 0;
    count = match_results.length;

    for (index = 0; index < count; index++) {
      if (match_results[index].was_found && match_results[index].platinum_price !== null) {
        total = total + match_results[index].platinum_price;
      }
    }

    return total;
  }
}

const fallback_item_database = new FallbackItemDatabase();
const warframe_market_service = new WarframeMarketService(AppConfig.warframe_market_base_url);
let active_catalog_source = warframe_market_service;
const ocr_service = new OcrService(active_catalog_source);
const price_matching_service = new PriceMatchingService(active_catalog_source);
let vaulted_info_map = {};

async function load_vaulted_info() {
  let response;

  try {
    response = await fetch("./vaulted_info.json");
    if (response.ok) {
      vaulted_info_map = await response.json();
      console.log("[VAULTED] Loaded info for " + Object.keys(vaulted_info_map).length + " items");
    }
  } catch (load_error) {
    console.log("[VAULTED] Could not load vaulted_info.json: " + load_error.message);
  }
}

function render_database_summary(item_count, source_label) {
  let list_container;

  list_container = document.getElementById("database_list");
  list_container.innerHTML = "<div class='item-row'><span class='item-name'>Source</span><span class='item-count'>" + source_label + "</span></div><div class='item-row'><span class='item-name'>Items Loaded</span><span class='item-count'>" + item_count + "</span></div>";
}

function set_mode_badge(text, is_error) {
  let badge;

  badge = document.getElementById("mode_badge");
  badge.textContent = text;
  badge.style.borderColor = is_error ? "var(--danger)" : "var(--void-cyan)";
  badge.style.color = is_error ? "var(--danger)" : "var(--void-cyan)";
}

async function initialize_catalog() {
  try {
    await warframe_market_service.fetch_all_items();
    active_catalog_source = warframe_market_service;
    ocr_service.name_source = active_catalog_source;
    price_matching_service.catalog_source = active_catalog_source;
    set_mode_badge("LIVE API (" + warframe_market_service.get_all_items().length + " ITEMS)", false);
    render_database_summary(warframe_market_service.get_all_items().length, "Warframe Market API (live)");
  } catch (fetch_error) {
    console.log("[API] Error loading catalog: " + fetch_error.message);

    if (AppConfig.use_mock_mode_fallback) {
      active_catalog_source = fallback_item_database;
      ocr_service.name_source = active_catalog_source;
      price_matching_service.catalog_source = active_catalog_source;
      set_mode_badge("FALLBACK MOCK (API NOT REACHABLE)", true);
      render_database_summary(fallback_item_database.get_all_items().length, "Mock Data (Fallback)");
      document.getElementById("database_list").innerHTML += "<div class='item-row' style='color:var(--danger); font-size:11px;'>" + fetch_error.message + "</div>";
    } else {
      set_mode_badge("ERROR", true);
    }
  }

  document.getElementById("scan_button").disabled = false;
  document.getElementById("camera_button").disabled = false;
}

function render_match_results(match_results, set_bonus_suggestions) {
  let result_container;
  let total_value_container;
  let result_panel;
  let index;
  let count;
  let row_html;
  let total_value;
  let name_display;
  let price_display;
  let highlight_html;
  let most_valuable_item;
  let most_traded_item;
  let suggestions_html;
  let suggestion_index;

  result_container = document.getElementById("result_list");
  total_value_container = document.getElementById("total_value");
  result_panel = document.getElementById("result_panel");
  row_html = "";
  count = match_results.length;
  most_valuable_item = null;
  most_traded_item = null;

  for (index = 0; index < count; index++) {
    if (match_results[index].was_found && match_results[index].platinum_price !== null) {
      if (most_valuable_item === null || match_results[index].platinum_price > most_valuable_item.platinum_price) {
        most_valuable_item = match_results[index];
      }
    }

    if (match_results[index].was_found && match_results[index].order_count !== null) {
      if (most_traded_item === null || match_results[index].order_count > most_traded_item.order_count) {
        most_traded_item = match_results[index];
      }
    }
  }

  highlight_html = "";

  if (most_valuable_item !== null) {
    highlight_html += "<div class='item-row' style='background:rgba(212,175,106,0.1); border-radius:6px; padding:8px 10px; margin-bottom:8px;'><span class='item-name'>💎 Most Valuable</span><span class='item-count' style='color:var(--orokin-gold);'>" + most_valuable_item.item_name + " (" + most_valuable_item.platinum_price + "p)</span></div>";
  }

  if (most_traded_item !== null && most_traded_item.order_count > 0) {
    highlight_html += "<div class='item-row' style='background:rgba(78,230,255,0.1); border-radius:6px; padding:8px 10px; margin-bottom:10px;'><span class='item-name'>🔥 Most Traded</span><span class='item-count' style='color:var(--void-cyan);'>" + most_traded_item.item_name + " (" + most_traded_item.order_count + " sellers)</span></div>";
  }

  for (index = 0; index < count; index++) {
    name_display = match_results[index].item_name;

    if (match_results[index].was_found && match_results[index].platinum_price !== null) {
      price_display = match_results[index].platinum_price + "p";
    } else if (match_results[index].was_found) {
      price_display = "no orders";
    } else {
      price_display = "?";
    }

    if (vaulted_info_map[name_display] && vaulted_info_map[name_display].vaulted) {
      name_display = name_display + " <span style='color:var(--orokin-gold); font-size:10px; border:1px solid var(--orokin-gold); border-radius:3px; padding:1px 4px; margin-left:4px;'>🔒 VAULTED</span>";
    }

    row_html += "<div class='item-row' style='flex-direction:column; align-items:flex-start; gap:4px;'><div style='display:flex; justify-content:space-between; width:100%;'><span class='item-name'>" + name_display + "</span><span class='item-count'>" + price_display + "</span></div>";

    if (match_results[index].matched_slug) {
      row_html += "<a href='https://warframe.market/items/" + match_results[index].matched_slug + "' target='_blank' rel='noopener' style='font-size:11px; color:var(--void-cyan); text-decoration:none;'>Open on Warframe Market →</a>";
    }

    row_html += "</div>";
  }

  suggestions_html = "";

  if (set_bonus_suggestions && set_bonus_suggestions.length > 0) {
    suggestions_html += "<div style='margin-top:14px; padding-top:12px; border-top:1px dashed var(--panel-border);'><div style='font-family:\"Rajdhani\",sans-serif; font-size:13px; letter-spacing:0.05em; color:var(--orokin-gold); text-transform:uppercase; margin-bottom:8px;'>📦 Set Bonus Detected</div>";

    for (suggestion_index = 0; suggestion_index < set_bonus_suggestions.length; suggestion_index++) {
      suggestions_html += "<div class='item-row' style='flex-direction:column; align-items:flex-start; gap:4px;'><div style='display:flex; justify-content:space-between; width:100%;'><span class='item-name'>" + set_bonus_suggestions[suggestion_index].base_name + " Set (" + set_bonus_suggestions[suggestion_index].parts_found + " parts found)</span><span class='item-count' style='color:var(--orokin-gold);'>" + (set_bonus_suggestions[suggestion_index].set_price !== null ? set_bonus_suggestions[suggestion_index].set_price + "p" : "no orders") + "</span></div><a href='https://warframe.market/items/" + set_bonus_suggestions[suggestion_index].set_slug + "' target='_blank' rel='noopener' style='font-size:11px; color:var(--void-cyan); text-decoration:none;'>Compare selling as a set →</a></div>";
    }

    suggestions_html += "</div>";
  }

  total_value = price_matching_service.calculate_total_value(match_results);

  result_container.innerHTML = highlight_html + row_html + suggestions_html;
  total_value_container.textContent = "~" + total_value + "p";
  result_panel.style.display = "block";
}

function show_raw_ocr_text(raw_text) {
  let text_container;

  text_container = document.getElementById("ocr_raw_text_container");
  text_container.textContent = "[Raw Text]\n" + raw_text;
  text_container.style.display = "block";
}

function show_ocr_preview() {
  let preview_container;

  if (!ocr_service.last_preprocessed_canvas) {
    return;
  }

  preview_container = document.getElementById("ocr_preview_container");
  preview_container.innerHTML = "";
  preview_container.appendChild(ocr_service.last_preprocessed_canvas);
  preview_container.style.display = "block";
}

async function handle_screenshot_selected(change_event) {
  let debug_container;
  let selected_file;
  let detected_slugs;
  let raw_ocr_text;
  let match_results;
  let set_bonus_suggestions;

  selected_file = change_event.target.files[0];

  if (!selected_file) {
    return;
  }

  debug_container = document.getElementById("debug_output");

  if (AppConfig.use_mock_ocr) {
    debug_container.textContent = "[OCR] Mock mode: simulating detection...";
    detected_slugs = ocr_service.scan_screenshot_mock();
    match_results = await price_matching_service.match_detected_slugs(detected_slugs);
    debug_container.textContent = "[OCR] " + detected_slugs.length + " Items erkannt (Mock-Modus)";
    render_match_results(match_results);
    return;
  }

  debug_container.textContent = "[OCR] Reading image... 0%";

  raw_ocr_text = await ocr_service.scan_screenshot_real(selected_file, function (progress_percent) {
    debug_container.textContent = "[OCR] Reading image... " + progress_percent + "%";
  });

  show_ocr_preview();
  show_raw_ocr_text(raw_ocr_text);
  console.log("[OCR] Recognized raw text:\n" + raw_ocr_text);
  debug_container.textContent = "[OCR] Text recognized, matching against catalog...";

  match_results = await price_matching_service.match_ocr_text(raw_ocr_text, function (total_matches, done_count) {
    if (done_count === undefined) {
      debug_container.textContent = "[MATCH] " + total_matches + " items found in text, fetching live prices...";
    } else {
      debug_container.textContent = "[MATCH] Prices fetched: " + done_count + " / " + total_matches;
    }
  });

  if (match_results.length === 0) {
    debug_container.textContent = "[OCR] No known items found in text. See raw text above for details.";
  } else {
    debug_container.textContent = "[OCR] " + match_results.length + " items detected in screenshot";
  }

  set_bonus_suggestions = await price_matching_service.detect_set_bonuses(match_results);
  render_match_results(match_results, set_bonus_suggestions);
}

document.getElementById("scan_button").addEventListener("click", function () {
  document.getElementById("screenshot_input").click();
});

document.getElementById("camera_button").addEventListener("click", function () {
  document.getElementById("camera_input").click();
});

document.getElementById("screenshot_input").addEventListener("change", handle_screenshot_selected);
document.getElementById("camera_input").addEventListener("change", handle_screenshot_selected);
function generate_app_icon_data_url() {
  let canvas;
  let canvas_context;
  let icon_size;

  icon_size = 192;
  canvas = document.createElement("canvas");
  canvas.width = icon_size;
  canvas.height = icon_size;
  canvas_context = canvas.getContext("2d");

  canvas_context.fillStyle = "#0a0e14";
  canvas_context.fillRect(0, 0, icon_size, icon_size);

  canvas_context.strokeStyle = "#d4af6a";
  canvas_context.lineWidth = 6;
  canvas_context.beginPath();
  canvas_context.arc(icon_size / 2, icon_size / 2, icon_size / 2 - 14, 0, Math.PI * 2);
  canvas_context.stroke();

  canvas_context.fillStyle = "#4ee6ff";
  canvas_context.font = "bold 88px sans-serif";
  canvas_context.textAlign = "center";
  canvas_context.textBaseline = "middle";
  canvas_context.fillText("W", icon_size / 2, icon_size / 2 + 6);

  return canvas.toDataURL("image/png");
}

function setup_pwa_metadata() {
  let icon_data_url;
  let icon_link;
  let apple_icon_link;
  let manifest_object;
  let manifest_blob;
  let manifest_url;
  let manifest_link;

  icon_data_url = generate_app_icon_data_url();

  icon_link = document.createElement("link");
  icon_link.rel = "icon";
  icon_link.href = icon_data_url;
  document.head.appendChild(icon_link);

  apple_icon_link = document.createElement("link");
  apple_icon_link.rel = "apple-touch-icon";
  apple_icon_link.href = icon_data_url;
  document.head.appendChild(apple_icon_link);

  manifest_object = {
    name: "Warframe Market Scanner",
    short_name: "WF Scanner",
    start_url: ".",
    display: "standalone",
    background_color: "#0a0e14",
    theme_color: "#0a0e14",
    icons: [{ src: icon_data_url, sizes: "192x192", type: "image/png" }]
  };

  manifest_blob = new Blob([JSON.stringify(manifest_object)], { type: "application/json" });
  manifest_url = URL.createObjectURL(manifest_blob);

  manifest_link = document.createElement("link");
  manifest_link.rel = "manifest";
  manifest_link.href = manifest_url;
  document.head.appendChild(manifest_link);
}

setup_pwa_metadata();
initialize_catalog();
load_vaulted_info();

</script>
